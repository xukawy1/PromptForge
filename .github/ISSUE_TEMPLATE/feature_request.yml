name: 💡 功能建议
description: 想要新功能或改进现有功能
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 描述想要的功能，以及它解决什么问题
      placeholder: "我希望 PromptForge 能……"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 采集中心
        - 知识库
        - Skill 工坊
        - Prompt 生成
        - 图片反推
        - 模型中心
        - Prompt 库 / 组件 / 模板
        - 历史记录
        - 设置（主题/背景）
        - 整体/其他
    validations:
      required: true
